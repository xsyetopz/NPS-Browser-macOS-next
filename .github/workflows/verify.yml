name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS 15 Intel / Xcode 16.4
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify Xcode 16.4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "Expected an Intel runner, got $(uname -m)." >&2
            exit 1
          fi

          xcode_app="/Applications/Xcode_16.4.app"
          developer_dir="$xcode_app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "Xcode 16.4 is not installed at $developer_dir." >&2
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          export DEVELOPER_DIR="$developer_dir"
          export TOOLCHAINS="com.apple.dt.toolchain.XcodeDefault"
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          printf 'TOOLCHAINS=%s\n' "$TOOLCHAINS" >> "$GITHUB_ENV"

          xcode_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$xcode_app/Contents/Info.plist")"
          printf 'Xcode bundle version: %s\n' "$xcode_version"
          if [[ "$xcode_version" != "16.4" ]]; then
            echo "Expected Xcode 16.4." >&2
            exit 1
          fi

          swift_version="$(xcrun swift --version)"
          printf '%s\n' "$swift_version"
          swift_version_regex='Apple Swift version 6\.1(\.[0-9]+)?([[:space:]]|\()'
          if [[ ! "$swift_version" =~ $swift_version_regex ]]; then
            echo "Expected Swift 6.1." >&2
            exit 1
          fi

          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK: %s\n' "$sdk_version"
          if [[ "$sdk_version" != "15.5" ]]; then
            echo "Expected the macOS 15.5 SDK bundled with Xcode 16.4." >&2
            exit 1
          fi

      - name: Install just and SwiftLint
        shell: bash
        run: brew install just swiftlint

      - name: Verify package and macOS 10.15 bundle
        shell: bash
        env:
          NPS_MACOS_DEPLOYMENT_TARGET: "10.15"
        run: just verify
